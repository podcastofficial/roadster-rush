<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Star Raid</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#040611;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(48px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;font-weight:900;font-size:16px;pointer-events:none;text-shadow:0 0 8px #00dfff}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#030612cc;text-align:center;padding:20px}
#menu h2{margin:0;font-size:26px;letter-spacing:3px;text-shadow:0 0 14px #ff20bd}
#menu p{margin:0;color:#b8cadd;font-size:13px}
button{height:50px;padding:0 30px;border-radius:14px;border:1px solid #31eaff;background:linear-gradient(100deg,#007eae,#5624ad);color:#fff;font-weight:bold;letter-spacing:2px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">SCORE 0</span><span id="lv">LVL 1</span><span id="li">♥♥♥</span></div>
<div id="menu"><h2 id="ttl">STAR RAID</h2><p id="sub">Drag to move. Your ship fires automatically.</p><button id="go">START</button></div>
<script>
const R=Math.random,$=id=>document.getElementById(id),c=$('c'),x=c.getContext('2d');
let W,H;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();addEventListener('resize',rs);
const stars=Array.from({length:70},()=>({x:R(),y:R(),s:.2+R()*.8}));
let px,tx,bul,en,pt,score,lives,level,kills,fire,spawn,run=false,inv=0,last=0;
function start(){
 px=tx=W/2;bul=[];en=[];pt=[];score=0;lives=3;level=1;kills=0;fire=0;spawn=0;inv=0;run=true;
 $('menu').style.display='none';hud();
}
function hud(){$('sc').textContent='SCORE '+score;$('lv').textContent='LVL '+level;$('li').textContent='♥'.repeat(Math.max(0,lives))}
function boom(a,b,col,n=10){for(let i=0;i<n;i++)pt.push({x:a,y:b,vx:(R()-.5)*260,vy:(R()-.5)*260,l:.5,c:col})}
function hit(){
 if(inv>0)return;
 lives--;inv=1.5;boom(px,H-70,'#00dfff',16);
 try{navigator.vibrate&&navigator.vibrate(60)}catch{}
 hud();
 if(lives<=0){
  run=false;
  try{parent.postMessage({type:'score',game:'shooter',score},'*')}catch{}
  $('ttl').textContent='GAME OVER';$('sub').textContent='Score '+score+' • Level '+level;$('go').textContent='PLAY AGAIN';$('menu').style.display='flex';
 }
}
function move(e){tx=e.clientX}
c.addEventListener('pointerdown',move);c.addEventListener('pointermove',move);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')tx-=60;if(e.key==='ArrowRight')tx+=60});
$('go').onclick=start;
function loop(t){
 requestAnimationFrame(loop);
 const dt=Math.min((t-last)/1000||0,.04);last=t;
 x.fillStyle='#050515';x.fillRect(0,0,W,H);
 for(const s of stars){s.y+=dt*(.05+s.s*.15);if(s.y>1)s.y=0;x.fillStyle='rgba(160,230,255,'+(.3+s.s*.5)+')';x.fillRect(s.x*W,s.y*H,1+s.s*1.5,1+s.s*1.5)}
 if(run){
  tx=Math.max(24,Math.min(W-24,tx));px+=(tx-px)*Math.min(1,dt*14);
  inv=Math.max(0,inv-dt);
  fire-=dt;
  if(fire<=0){
   fire=Math.max(.12,.28-level*.015);
   const sh=level>=4?[-12,0,12]:level>=2?[-8,8]:[0];
   for(const o of sh)bul.push({x:px+o,y:H-90});
  }
  spawn-=dt;
  if(spawn<=0){
   spawn=Math.max(.35,1.1-level*.07);
   const big=level>2&&R()<.2;
   en.push({x:30+R()*(W-60),y:-30,r:big?26:16,hp:big?3:1,v:60+level*9+R()*40,sw:R()*6});
  }
  for(let i=bul.length-1;i>=0;i--){const b=bul[i];b.y-=640*dt;if(b.y<-10)bul.splice(i,1)}
  for(let i=en.length-1;i>=0;i--){
   const e=en[i];e.y+=e.v*dt;e.sw+=dt*2;e.x+=Math.sin(e.sw)*40*dt;
   for(let j=bul.length-1;j>=0;j--){
    const b=bul[j];
    if(Math.abs(b.x-e.x)<e.r&&Math.abs(b.y-e.y)<e.r){bul.splice(j,1);e.hp--;boom(b.x,b.y,'#ff31c8',3);break}
   }
   if(e.hp<=0){
    score+=e.r>20?30:10;kills++;boom(e.x,e.y,'#ffb347',12);en.splice(i,1);
    if(kills%12===0)level++;
    hud();continue;
   }
   if(Math.abs(e.x-px)<e.r+14&&Math.abs(e.y-(H-70))<e.r+16){en.splice(i,1);boom(e.x,e.y,'#ffb347',12);hit();continue}
   if(e.y>H+30){en.splice(i,1);lives--;hud();if(lives<=0){lives=1;hit()}}
  }
 }
 for(let i=pt.length-1;i>=0;i--){const p=pt[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)pt.splice(i,1);else{x.globalAlpha=p.l*2;x.fillStyle=p.c;x.fillRect(p.x,p.y,3,3)}}
 x.globalAlpha=1;
 x.shadowBlur=14;
 x.fillStyle='#ff31c8';x.shadowColor='#ff31c8';
 for(const b of bul)x.fillRect(b.x-2,b.y-8,4,12);
 for(const e of en){x.fillStyle=e.r>20?'#9a53ff':'#ff2458';x.shadowColor=x.fillStyle;x.beginPath();x.moveTo(e.x,e.y+e.r);x.lineTo(e.x+e.r,e.y);x.lineTo(e.x,e.y-e.r);x.lineTo(e.x-e.r,e.y);x.closePath();x.fill()}
 if(run&&(inv<=0||Math.floor(t/90)%2)){
  x.fillStyle='#00dfff';x.shadowColor='#00dfff';
  x.beginPath();x.moveTo(px,H-100);x.lineTo(px+18,H-55);x.lineTo(px,H-65);x.lineTo(px-18,H-55);x.closePath();x.fill();
 }
 x.shadowBlur=0;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
