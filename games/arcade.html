<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Neon Arcade Game</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050711;color:#fff;font:16px system-ui;display:grid;place-items:center;padding:18px}main{width:min(620px,100%);text-align:center}h1{color:#64f4ff;text-shadow:0 0 18px #00d9ff;margin:8px 0}.sub{color:#9db0ca}.hud{display:flex;justify-content:space-between;gap:8px;margin:16px 0;color:#ffd76a}.stage{position:relative;height:min(62vh,520px);min-height:360px;border:1px solid #21ddff88;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#252061,#07101d 65%)}canvas{width:100%;height:100%;display:block}.hint{color:#9db0ca;margin:14px}.btn{background:#10d9e9;color:#001016;border:0;border-radius:12px;padding:13px 22px;font-weight:800}.back{color:#64f4ff;text-decoration:none;display:inline-block;margin-top:14px}</style></head><body><main><h1 id="title">NEON ARCADE</h1><div class="sub" id="desc"></div><div class="hud"><span id="score">SCORE 0</span><span id="level">LEVEL 1</span><span id="best">BEST 0</span></div><div class="stage"><canvas id="game"></canvas></div><div class="hint" id="hint">Tap, click, or use arrow keys to play</div><button class="btn" id="restart">RESTART</button><br><a class="back" href="../index.html">Back to game hub</a></main><script>const games={runner:['NEON RUNNER','Dodge the city barriers','Swipe or use arrows'],shooter:['STAR RAID','Shoot incoming drones','Tap to fire'],puzzle:['COLOR SHIFT','Match the falling gems','Tap the matching lane'],maze:['GLOW MAZE','Collect orbs and escape','Use arrows'],stack:['TOWER STACK','Build the tallest tower','Tap to place'],memory:['MEMORY FLIP','Find matching pairs','Tap cards'],snake:['NEON SNAKE','Grow without crashing','Use arrows'],breaker:['BRICK BREAKER','Clear every neon block','Move the paddle'],target:['TARGET HUNT','Hit targets before time runs out','Tap targets'],drift:['DRIFT CIRCUIT','Survive the sharp turns','Use arrows'],orbit:['ORBIT DEFENDER','Protect the core','Tap enemies'],jump:['SKY JUMPER','Jump between platforms','Tap to jump'],word:['WORD RUSH','Solve the neon word','Tap the answer'],match:['GEM MATCH','Connect glowing gems','Tap gems'],asteroid:['ASTEROID BELT','Avoid the space rocks','Drag to steer'],fishing:['PIXEL FISHING','Catch the rare fish','Tap when ready'],soccer:['NEON GOAL','Score against the keeper','Tap to shoot'],rocket:['ROCKET FUEL','Collect fuel in flight','Tap to boost'],traffic:['TRAFFIC JAM','Find the safe lane','Tap a lane'],cards:['CYBER CARDS','Beat the dealer','Tap higher card'],dungeon:['DUNGEON DASH','Find the exit key','Use arrows'],pinball:['NEON PINBALL','Keep the ball alive','Tap flippers']} ;const key=new URLSearchParams(location.search).get('game')||'runner',g=games[key]||games.runner;title.textContent=g[0];desc.textContent=g[1];hint.textContent=g[2];const c=game,x=c.getContext('2d');let W,H,score=0,best=+localStorage.getItem('neon-best-'+key)||0,t=0,over=false,player={x:.5,y:.8},objects=[];bestEl=best;function resize(){W=c.width=c.clientWidth*devicePixelRatio;H=c.height=c.clientHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);W=c.clientWidth;H=c.clientHeight}addEventListener('resize',resize);resize();function draw(){x.clearRect(0,0,W,H);x.fillStyle='#071525';x.fillRect(0,0,W,H);x.strokeStyle='#1cabc855';for(let i=0;i<12;i++){x.beginPath();x.moveTo(i*W/12,0);x.lineTo(W/2+(i-6)*60,H);x.stroke()}x.fillStyle='#8b5cff';x.shadowBlur=18;x.shadowColor='#8b5cff';x.beginPath();x.arc(player.x*W,player.y*H,16,0,7);x.fill();x.shadowBlur=0;objects.forEach(o=>{x.fillStyle=o.color;x.shadowBlur=14;x.shadowColor=o.color;x.fillRect(o.x*W,o.y*H,22,22)});x.shadowBlur=0}function loop(){if(over)return; t++;if(t%28===0){objects.push({x:Math.random()*.9,y:.05,color:['#ff4f9a','#ffd166','#45f5ff'][Math.floor(Math.random()*3)]});score++;scoreEl.textContent='SCORE '+score}objects.forEach(o=>o.y+=.008);objects=objects.filter(o=>o.y<1.1);if(objects.some(o=>Math.hypot(o.x-player.x,o.y-player.y)<.06)){over=true;hint.textContent='RUN OVER — score '+score;if(score>best){best=score;localStorage.setItem('neon-best-'+key,best);bestEl.textContent='BEST '+best}postMessage({type:'score',game:key,score},'*')}draw();requestAnimationFrame(loop)}function move(dx,dy){player.x=Math.max(.05,Math.min(.95,player.x+dx));player.y=Math.max(.08,Math.min(.92,player.y+dy))}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-.08,0);if(e.key==='ArrowRight')move(.08,0);if(e.key==='ArrowUp')move(0,-.08);if(e.key==='ArrowDown')move(0,.08)});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();move((e.clientX-r.left<r.width/2)?-.1:.1,0)});restart.onclick=()=>location.reload();const scoreEl=document.getElementById('score'),bestElNode=document.getElementById('best');bestElNode.textContent='BEST '+best;loop();</script></body></html>
