<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050711"><title>Neon Arcade — Level Up</title><style>
*{box-sizing:border-box}body{margin:0;background:#050711;color:#fff;font:15px system-ui,-apple-system,sans-serif;padding:20px 14px 32px}.wrap{max-width:620px;margin:auto}h1{font-size:30px;letter-spacing:3px;margin:4px 0;color:#70f4ff;text-shadow:0 0 20px #00cfff}.sub{color:#a7b8d0}.wallet{display:flex;justify-content:space-between;align-items:center;margin:18px 0;padding:14px 16px;border:1px solid #35e8ff66;border-radius:16px;background:linear-gradient(120deg,#101d3d,#20133d)}.coins{color:#ffd76a;font-weight:800;font-size:18px}.level{color:#c99cff;font-size:13px}.bar{height:6px;background:#17223c;border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#00dbff,#b85cff);width:35%}h2{font-size:12px;letter-spacing:2px;color:#73eaff;margin:24px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid #2cdef466;border-radius:16px;background:#0c1730;color:#fff;text-align:left;padding:15px;min-height:142px;display:flex;flex-direction:column;gap:6px;cursor:pointer}.card:active{transform:scale(.97)}.card strong{font-size:16px}.card span{color:#a8bad3;font-size:12px}.card small{color:#ffd76a;margin-top:auto}.badge{font-size:10px;color:#75f2ff;letter-spacing:1px}.section{display:flex;justify-content:space-between;align-items:center}.upgrade{border:1px solid #ffcf6a55;border-radius:16px;padding:15px;background:#17152a}.upgrade p{margin:4px 0;color:#b9c8dc;font-size:13px}.upgrade button{border:0;border-radius:10px;background:#ffd15a;padding:9px 12px;font-weight:800;float:right}.upgrade button:disabled{opacity:.4}.nav{display:flex;gap:8px;margin-top:16px}.nav button{flex:1;background:#0c1730;color:#9fd8e5;border:1px solid #2cdef444;border-radius:10px;padding:10px;font-weight:700}
</style></head><body><main class="wrap"><h1>NEON ARCADE</h1><div class="sub">Choose a game. Earn coins. Build your legend.</div><section class="wallet"><div><div class="level" id="rank">PLAYER LEVEL 1</div><div class="bar"><i id="xpbar"></i></div></div><div class="coins" id="coins">RC 500</div></section><div class="section"><h2>ACTIVE SEASON</h2><span class="badge">SEASON 01</span></div><div class="grid" id="games"></div><h2>UPGRADE LAB</h2><div class="upgrade"><strong>Arcade Passive Bonus</strong><p>Increase coin rewards from every run.</p><button id="upgrade">UPGRADE · RC 250</button></div><div class="nav"><button>MISSIONS</button><button>LEADERBOARD</button><button>GARAGE</button></div></main><script>
const games=[['runner','Neon Runner','Dodge barriers and chain perfect runs','RUN'],['shooter','Star Raid','Defeat waves of drones','WAVE'],['puzzle','Color Shift','Solve increasingly complex grids','PUZZLE'],['maze','Glow Maze','Escape before the timer expires','ESCAPE'],['stack','Tower Stack','Build higher for bigger rewards','STACK'],['memory','Memory Flip','Clear the board with fewer moves','BRAIN'],['snake','Neon Snake','Grow your energy trail','ARCADE'],['breaker','Brick Breaker','Clear every neon sector','SECTOR'],['target','Target Hunt','Hit targets before they vanish','AIM'],['drift','Drift Circuit','Master dangerous corners','DRIFT']];
let p=JSON.parse(localStorage.getItem('neon-profile')||'{"coins":500,"xp":0,"bonus":0}');const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('neon-profile',JSON.stringify(p));function render(){ $('coins').textContent='RC '+p.coins;const lv=1+Math.floor(p.xp/100);$('rank').textContent='PLAYER LEVEL '+lv;$('xpbar').style.width=(p.xp%100)+'%';$('upgrade').disabled=p.coins<250||p.bonus>=5;$('upgrade').textContent=p.bonus>=5?'MAX LEVEL':'UPGRADE · RC '+(250+p.bonus*150)}
const gameGrid=$('games');games.forEach(g=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="badge">'+g[3]+'</span><strong>'+g[1]+'</strong><span>'+g[2]+'</span><small>LEVEL '+(1+Math.min(9,p.bonus))+' · PLAY TO EARN</small>';b.onclick=()=>location.href='games/arcade.html?game='+g[0];gameGrid.appendChild(b)});upgrade.onclick=()=>{const cost=250+p.bonus*150;if(p.coins>=cost&&p.bonus<5){p.coins-=cost;p.bonus++;save();render()}};render();
</script></body></html>
