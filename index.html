<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#040611">
<title>Neon Arcade</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#040611;color:#fff;font-family:Arial,sans-serif}
body{background:radial-gradient(ellipse at top,#1b1236 0,#040611 55%);padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:auto}
h1{font-size:28px;letter-spacing:2px;margin:6px 0 2px;text-shadow:0 0 10px #00dfff,0 0 26px #008cff}
.hi{color:#ff64dc;font-size:13px;margin-bottom:18px;min-height:16px}
h2{font-size:12px;letter-spacing:2px;color:#6feaff;margin:22px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{position:relative;background:#0a1630;border:1px solid #20dfff66;border-radius:16px;padding:16px 14px;text-align:left;color:#fff;min-height:132px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font:inherit}
.card:active{transform:scale(.97);background:#0d2244}
.card .ic{font-size:34px}
.card b{font-size:15px}
.card span{font-size:12px;color:#a4bfd5}
.card em{font-style:normal;font-size:11px;color:#ffd36a;margin-top:auto}
.card.soon{opacity:.45;cursor:default;border-style:dashed;border-color:#ff64dc66}
.card.soon:active{transform:none;background:#0a1630}
#play{position:fixed;inset:0;z-index:10;background:#040611;display:none}
#play iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#back{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;z-index:11;height:36px;min-width:36px;border-radius:10px;border:1px solid #31eaff;background:#0a1930dd;color:#fff;font-size:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
 <h1>NEON ARCADE</h1>
 <div class="hi" id="hi"></div>
 <h2>PLAY NOW</h2>
 <div class="grid" id="games"></div>
 <h2>COMING SOON</h2>
 <div class="grid" id="soon"></div>
</div>
<div id="play"><button id="back" aria-label="Close game">✕</button><iframe id="frame" title="Game" allow="autoplay"></iframe></div>

<script>
const tg=window.Telegram&&window.Telegram.WebApp;
const $=id=>document.getElementById(id);
const GAMES=[
 {id:'racing',name:'Roadster Rush 2',desc:'3D neon racer',icon:'🏎️',src:'games/racing.html'},
 {id:'g2048',name:'Neon 2048',desc:'Slide and merge tiles',icon:'🔢',src:'games/2048.html'},
 {id:'shooter',name:'Star Raid',desc:'Space shooter',icon:'🚀',src:'games/shooter.html'},
 {id:'paddle',name:'Paddle Duel',desc:'Beat the AI',icon:'🏓',src:'games/paddle.html'},
 {id:'blocks',name:'Block Drop',desc:'Falling-block puzzle',icon:'🧩',src:'games/blocks.html'},
 {id:'maze',name:'Glow Maze',desc:'Eat dots, dodge drones',icon:'🟡',src:'games/maze.html'},
 {id:'bombs',name:'Bomb Blast',desc:'Crates, bombs, robots',icon:'💣',src:'games/bombs.html'},
 {id:'hero',name:'Neon Hero',desc:'Platformer, endless levels',icon:'🦸',src:'games/hero.html'}
];
const SOON=[['Endless Runner 3D','🏃'],['Stack Tower','🧱'],['Neon Snake','🐍'],['Memory Match','🃏']];
let scores={};

/* ---- Telegram setup (safe outside Telegram too) ---- */
if(tg){
 try{tg.ready();tg.expand();}catch{}
 try{tg.setHeaderColor('#040611');tg.setBackgroundColor('#040611');}catch{}
 try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}catch{}
 const u=tg.initDataUnsafe&&tg.initDataUnsafe.user;
 if(u&&u.first_name)$('hi').textContent='Welcome, '+u.first_name+'. Pick a game.';
}
if(!$('hi').textContent)$('hi').textContent='Pick a game.';
const buzz=k=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(k||'light')}catch{}};

/* ---- Scores: Telegram CloudStorage with localStorage fallback ---- */
function loadScores(){
 try{scores=JSON.parse(localStorage.getItem('arcade-scores')||'{}')}catch{scores={}}
 render();
 try{
  if(tg&&tg.CloudStorage)tg.CloudStorage.getItem('scores',(err,val)=>{
   if(err||!val)return;
   try{const c=JSON.parse(val);for(const k in c)if(Number(c[k])>(scores[k]||0))scores[k]=Number(c[k]);render()}catch{}
  });
 }catch{}
}
function saveScores(){
 const s=JSON.stringify(scores);
 try{localStorage.setItem('arcade-scores',s)}catch{}
 try{tg&&tg.CloudStorage&&tg.CloudStorage.setItem('scores',s,()=>{})}catch{}
}

/* ---- Cards ---- */
function card(g){
 const b=document.createElement('button');b.className='card';b.type='button';
 const i=document.createElement('div');i.className='ic';i.textContent=g.icon;
 const n=document.createElement('b');n.textContent=g.name;
 const d=document.createElement('span');d.textContent=g.desc;
 const e=document.createElement('em');e.textContent='BEST '+(scores[g.id]||0);
 b.append(i,n,d,e);b.onclick=()=>open(g);return b;
}
function render(){
 const gr=$('games');gr.textContent='';GAMES.forEach(g=>gr.appendChild(card(g)));
 const so=$('soon');if(so.childElementCount)return;
 SOON.forEach(([n,ic])=>{
  const b=document.createElement('div');b.className='card soon';
  const i=document.createElement('div');i.className='ic';i.textContent=ic;
  const t=document.createElement('b');t.textContent=n;
  const s=document.createElement('span');s.textContent='Coming soon';
  b.append(i,t,s);so.appendChild(b);
 });
}

/* ---- Open / close a game ---- */
let cur=null;
function open(g){
 buzz('medium');cur=g;
 $('frame').src=g.src;$('play').style.display='block';
 if(tg&&tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(close)}else $('back').style.display='block';
}
function close(){
 cur=null;$('frame').src='about:blank';$('play').style.display='none';$('back').style.display='none';
 if(tg&&tg.BackButton){tg.BackButton.hide();tg.BackButton.offClick(close)}
 render();
}
$('back').onclick=close;

/* ---- Score messages from the game iframe ---- */
addEventListener('message',e=>{
 if(e.source!==$('frame').contentWindow||!cur)return;
 const d=e.data;
 if(d&&d.type==='haptic'){
  const k=['light','medium','heavy','success','warning','error'].includes(d.kind)?d.kind:'light';
  try{
   if(tg&&tg.HapticFeedback){['success','warning','error'].includes(k)?tg.HapticFeedback.notificationOccurred(k):tg.HapticFeedback.impactOccurred(k)}
   else if(navigator.vibrate)navigator.vibrate(k==='heavy'||k==='error'?90:30);
  }catch{}
  return;
 }
 if(!d||d.type!=='score'||d.game!==cur.id)return;
 const s=Math.floor(Number(d.score));
 if(!Number.isFinite(s)||s<0||s>1e9)return;
 try{tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success')}catch{}
 if(s>(scores[cur.id]||0)){scores[cur.id]=s;saveScores()}
});
loadScores();
</script>
</body>
</html>
