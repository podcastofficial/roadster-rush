<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050713">
<title>ROADSTER RUSH 2 | Cyberpunk Racing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040611;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1.3fr 1.2fr 1fr .7fr;gap:5px;pointer-events:none;z-index:2}
.panel{background:#071426ee;border:1px solid #20dfff88;border-radius:10px;padding:7px 9px;min-width:0}
.label{font-size:8px;letter-spacing:1.4px;color:#6feaff}
.value{font-size:17px;font-weight:900;margin-top:3px;white-space:nowrap}
.value small{font-size:8px;color:#a4bfd5}
#status{position:absolute;top:72px;left:0;right:0;text-align:center;z-index:2;pointer-events:none;font-size:11px;letter-spacing:1px;color:#ffd36a;text-shadow:0 0 8px #000}
#brand{position:absolute;top:96px;left:0;right:0;text-align:center;pointer-events:none;z-index:2;transition:opacity .6s}
#brand h1{font-size:clamp(20px,5vw,32px);letter-spacing:3px;margin:0;text-shadow:0 0 8px #00dfff,0 0 22px #008cff}
#brand p{font-size:9px;letter-spacing:4px;color:#ff64dc;margin:5px}
#message{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:24px;font-weight:900;color:#ff70df;text-shadow:0 0 15px #ff20bd;z-index:4;pointer-events:none}
#controls{position:absolute;z-index:3;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;padding:0 16px;display:flex;justify-content:space-between;align-items:end}
.group{display:flex;gap:10px}
button{min-width:64px;height:58px;border-radius:14px;border:1px solid #31eaff;background:#0a1930ed;color:#fff;font-size:23px;font-weight:bold;touch-action:none;user-select:none}
button:active{background:#086a8b;transform:scale(.96)}
#nitro{width:96px;height:56px;font-size:12px;color:#ff83e5;border-color:#ff51d5}
#fuelbar{height:4px;background:#352039;margin-top:5px;border-radius:5px;overflow:hidden}
#fuel{height:100%;width:100%;background:linear-gradient(90deg,#ff36d3,#9a62ff)}
#mini{position:absolute;z-index:3;bottom:max(84px,calc(env(safe-area-inset-bottom) + 70px));right:12px;display:flex;gap:8px}
#mini button{min-width:42px;height:38px;font-size:16px;border-radius:10px}
#startScreen{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#03061275,#030612e8)}
.dialog{width:100%;max-width:350px;text-align:center;padding:24px 20px;background:#091426f5;border:1px solid #31eaff99;border-radius:20px}
.dialog h2{font-size:24px;letter-spacing:2px;margin:0 0 8px}
.dialog p{font-size:13px;color:#b8cadd;line-height:1.55;margin:7px 0}
#best{color:#6feaff;font-weight:bold}
#start{width:100%;height:52px;font-size:14px;letter-spacing:2px;background:linear-gradient(100deg,#007eae,#5624ad)}
@media(max-height:550px){#brand{top:70px}#controls{bottom:7px}button{height:46px;min-width:54px}#mini{bottom:60px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
 <div class="panel"><div class="label">SPEED</div><div class="value"><span id="speed">0</span><small> KM/H</small></div></div>
 <div class="panel"><div class="label">DIST</div><div class="value"><span id="distance">0</span><small>M</small></div></div>
 <div class="panel"><div class="label">LVL</div><div class="value" id="level">1</div></div>
</div>
<div id="status"></div>
<div id="brand"><h1>ROADSTER RUSH 2</h1><p>CYBERPUNK RACING</p></div>
<div id="message"></div>
<div id="mini"><button id="snd" aria-label="Sound">🔊</button><button id="pause" aria-label="Pause">⏸</button></div>
<div id="controls">
 <div class="group"><button id="left" aria-label="Left">◀</button><button id="right" aria-label="Right">▶</button></div>
 <button id="nitro">⚡ NITRO<div id="fuelbar"><div id="fuel"></div></div></button>
</div>
<div id="startScreen">
 <div class="dialog">
  <h2 id="title">READY TO RACE?</h2>
  <p>Dodge cars, trucks and barriers. Grab coins, near-miss traffic for bonus, and collect shields.</p>
  <p>Keys: A/D or arrows, Space = nitro, P = pause.</p>
  <p id="last"></p>
  <p id="best">BEST SCORE: 0</p>
  <button id="start">▶ START RACING</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id),R=Math.random,cl=THREE.MathUtils.clamp,lp=THREE.MathUtils.lerp;
const LANES=[-2.8,0,2.8];

/* ---------- Renderer / scene ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x070618);
scene.fog=new THREE.Fog(0x140a2e,35,125);
const cam=new THREE.PerspectiveCamera(63,innerWidth/innerHeight,.1,260);
const rend=new THREE.WebGLRenderer({canvas:$('game'),antialias:false,powerPreference:'high-performance'});
rend.setPixelRatio(Math.min(devicePixelRatio||1,1.25));
rend.setSize(innerWidth,innerHeight);
rend.outputColorSpace=THREE.SRGBColorSpace;
rend.toneMapping=THREE.ACESFilmicToneMapping;
rend.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight(0x9acbff,0x1a0f2e,2));
const sun=new THREE.DirectionalLight(0xffb0e8,1.6);sun.position.set(-4,8,5);scene.add(sun);

const mat=(c,e=0,i=0,m=.25)=>new THREE.MeshStandardMaterial({color:c,emissive:e,emissiveIntensity:i,roughness:.48,metalness:m});
const cyan=mat(0x00dfff,0x00aaff,1.8),pink=mat(0xff31c8,0xff0099,1.6),white=mat(0xbbeeff,0x65cfff,.7);
const dark=mat(0x101625,0x080b18,.25),glass=mat(0x17354b,0x04172a,.5,.55),rubber=mat(0x080a10);
const red=mat(0xff1a3c,0xff0020,2),gold=mat(0xffc933,0xffa000,1.4,.6),cabinM=mat(0x18253b,0x07172a,.3);
const boxGeo=new THREE.BoxGeometry(1,1,1);
function box(p,w,h,d,m,x=0,y=0,z=0){const o=new THREE.Mesh(boxGeo,m);o.scale.set(w,h,d);o.position.set(x,y,z);p.add(o);return o}

/* ---------- Sky: neon sun ---------- */
const sunA=new THREE.Mesh(new THREE.CircleGeometry(26,40),new THREE.MeshBasicMaterial({color:0xff2fa8,fog:false}));
sunA.position.set(0,20,-210);scene.add(sunA);
const sunB=new THREE.Mesh(new THREE.CircleGeometry(17,40),new THREE.MeshBasicMaterial({color:0xffb347,fog:false}));
sunB.position.set(0,19,-209);scene.add(sunB);

/* ---------- Road ---------- */
const road=new THREE.Mesh(new THREE.PlaneGeometry(12,200),mat(0x111522,0x050814,.4));
road.rotation.x=-Math.PI/2;road.position.set(0,-.06,-75);scene.add(road);
for(const x of [-5.6,5.6])box(scene,.12,.08,200,x<0?cyan:pink,x,.02,-75);
for(const x of [-4.4,4.4])box(scene,.05,.04,200,x<0?cyan:pink,x,.01,-75);
const dashes=[];
for(const x of [-1.4,1.4])for(let i=0;i<22;i++)dashes.push(box(scene,.07,.025,2,white,x,.01,-i*5));

/* ---------- Skyline with lit windows ---------- */
function winTex(){
 const c=document.createElement('canvas');c.width=32;c.height=64;const g=c.getContext('2d');
 g.fillStyle='#000';g.fillRect(0,0,32,64);
 for(let y=2;y<64;y+=6)for(let x=2;x<32;x+=6)if(R()<.45){g.fillStyle=R()<.5?'#19d8ff':R()<.5?'#ff3ccf':'#ffd36a';g.fillRect(x,y,3,4)}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.magFilter=THREE.NearestFilter;return t;
}
const bMats=[0,1].map(()=>new THREE.MeshStandardMaterial({color:0x0d1428,emissive:0xffffff,emissiveMap:winTex(),emissiveIntensity:1.1,roughness:.6}));
const buildings=[];
for(let i=0;i<36;i++){
 const side=i%2?1:-1,h=6+R()*22,w=2.5+R()*3.5,g=new THREE.Group();
 box(g,w,h,4,bMats[i%2],0,h/2,0);
 box(g,w+.1,.08,4.1,i%3?cyan:pink,0,h,0);
 g.position.set(side*(8+R()*8),0,-R()*130);
 scene.add(g);buildings.push(g);
}
const arches=[];
for(let i=0;i<6;i++){
 const g=new THREE.Group();
 box(g,.1,4.5,.1,cyan,-5.2,2.2,0);box(g,.1,4.5,.1,pink,5.2,2.2,0);box(g,10.5,.1,.1,i%2?pink:cyan,0,4.4,0);
 g.position.z=-i*24-10;scene.add(g);arches.push(g);
}

/* ---------- Player car ---------- */
const car=new THREE.Group();
const bodyMat=mat(0x08a9d0,0x003b5a,.6,.75);
box(car,1.48,.36,2.65,bodyMat,0,.54,0);box(car,1.2,.12,1.05,cyan,0,.74,-.68);
box(car,.98,.32,1.08,glass,0,.83,-.08);box(car,.72,.045,.65,dark,0,1,-.08);
box(car,1.38,.065,.18,dark,0,.34,-1.32);box(car,1.36,.07,.2,dark,0,.86,1.05);
for(const x of [-.52,.52]){box(car,.31,.055,.04,white,x,.6,-1.34);box(car,.37,.06,.04,pink,x,.6,1.34)}
const wheels=[],wg=new THREE.CylinderGeometry(.24,.24,.17,10),rg=new THREE.CylinderGeometry(.13,.13,.18,8);
for(const x of [-.77,.77])for(const z of [-.86,.88]){
 const w=new THREE.Mesh(wg,rubber);w.rotation.z=Math.PI/2;w.position.set(x,.28,z);car.add(w);wheels.push(w);
 const r=new THREE.Mesh(rg,cyan);r.rotation.z=Math.PI/2;r.position.copy(w.position);car.add(r);
}
const glow=new THREE.Mesh(new THREE.PlaneGeometry(1.8,2.7),new THREE.MeshBasicMaterial({color:0x00cfff,transparent:true,opacity:.25,side:THREE.DoubleSide}));
glow.rotation.x=-Math.PI/2;glow.position.y=.025;car.add(glow);
const beam=new THREE.Mesh(new THREE.PlaneGeometry(2.4,14),new THREE.MeshBasicMaterial({color:0xaee9ff,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false}));
beam.rotation.x=-Math.PI/2;beam.position.set(0,.04,-8);car.add(beam);
const jets=[];
for(const x of [-.4,.4]){
 const j=new THREE.Mesh(new THREE.ConeGeometry(.11,1,6),new THREE.MeshBasicMaterial({color:x<0?0x00eaff:0xff32cc,transparent:true,opacity:.8}));
 j.rotation.x=Math.PI/2;j.position.set(x,.4,1.85);j.visible=false;car.add(j);jets.push(j);
}
const shieldM=new THREE.Mesh(new THREE.SphereGeometry(1.9,14,10),new THREE.MeshBasicMaterial({color:0x35e8ff,transparent:true,opacity:.22,wireframe:true}));
shieldM.position.y=.7;shieldM.visible=false;car.add(shieldM);
car.position.set(0,0,3);scene.add(car);

/* ---------- Speed particles ---------- */
const PN=160,pg=new THREE.BufferGeometry(),pp=new Float32Array(PN*3);
for(let i=0;i<PN;i++){pp[i*3]=(R()-.5)*30;pp[i*3+1]=.2+R()*9;pp[i*3+2]=-R()*130}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({color:0x9ff4ff,size:.14,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(pg,pm));

/* ---------- Entities ---------- */
const ents=[];
const vcols=[0xff2458,0x9a53ff,0xffa52e,0x20d9b0,0x4f7cff];
function mkVehicle(truck){
 const g=new THREE.Group(),c=vcols[R()*vcols.length|0],m=mat(c,c,.3,.5);let l;
 if(truck){l=4.4;box(g,1.6,1.5,3.4,m,0,1,.5);box(g,1.45,.95,1,cabinM,0,.75,-1.7)}
 else{l=2.2;box(g,1.25,.5,2.2,m,0,.45,0);box(g,.9,.35,1,cabinM,0,.9,.1)}
 box(g,1.1,.1,.05,red,0,.6,l/2);
 return{g,w:truck?1.6:1.25,l};
}
function mkBarrier(){
 const g=new THREE.Group();box(g,2.4,.55,.3,pink,0,.65,0);box(g,.15,.9,.15,dark,-1.1,.45,0);box(g,.15,.9,.15,dark,1.1,.45,0);
 return{g,w:2.4,l:.6};
}
const coinGeo=new THREE.CylinderGeometry(.34,.34,.08,12),octGeo=new THREE.OctahedronGeometry(.5);
const shMat=mat(0x35e8ff,0x00c8ff,2),nitMat=mat(0xff40d8,0xff00aa,2);
function add(o,k,x,z,s,extra){
 o.g.position.set(x,0,z);scene.add(o.g);
 ents.push(Object.assign({g:o.g,k,w:o.w,l:o.l,s,near:false},extra));
}
function spawnCoin(x,z){
 const g=new THREE.Group(),c=new THREE.Mesh(coinGeo,gold);c.rotation.x=Math.PI/2;c.position.y=.7;g.add(c);
 add({g,w:.7,l:.7},'coin',x,z,1);
}
function spawnPickup(k,x,z){
 const g=new THREE.Group(),m=new THREE.Mesh(octGeo,k==='sh'?shMat:nitMat);m.position.y=.8;g.add(m);
 add({g,w:1,l:1},k,x,z,1);
}
let lastLane=1;
function spawn(){
 if(ents.length>18)return;
 let lane;do lane=R()*3|0;while(lane===lastLane&&level<3&&R()<.7);lastLane=lane;
 const x=LANES[lane],r=R(),z=-115;
 if(r<.55){
  const o=mkVehicle(level>1&&R()<.25);
  add(o,'veh',x,z,.85,{sw:level>2&&R()<.3,lane,done:false});
 }else if(r<.75){for(let i=0;i<5;i++)spawnCoin(x,z-i*3.5)}
 else if(r<.85&&level>1)add(mkBarrier(),'bar',x,z,1);
 else if(r<.93&&!shield)spawnPickup('sh',x,z);
 else spawnPickup('nit',x,z);
}

/* ---------- Audio ---------- */
let ac,eng,engG,sfxOn=true;
function initAudio(){
 if(ac){if(ac.state==='suspended')ac.resume();return}
 try{
  ac=new (window.AudioContext||window.webkitAudioContext)();
  eng=ac.createOscillator();eng.type='sawtooth';
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
  engG=ac.createGain();engG.gain.value=0;
  eng.connect(f);f.connect(engG);engG.connect(ac.destination);eng.start();
 }catch{ac=null}
}
function beep(f,d=.1,t='square',v=.06){
 if(!ac||!sfxOn)return;
 const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;
 g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
 o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
}

/* ---------- State ---------- */
let running=false,paused=false,dying=false,dieT=0,ts=1,nitro=false;
let score=0,distance=0,v=0,vBase=26,level=1,x=0,steer=0,fuel=100,spawnT=0,last=0;
let shield=false,combo=0,comboT=0,coins=0,shake=0,msgT=0,fov=63;
let best=0;try{best=Number(localStorage.getItem('rr2-best')||0)}catch{}
$('best').textContent='BEST SCORE: '+best;
const mult=()=>Math.min(5,1+Math.floor(combo/5));

function pop(t,ms=900){$('status').textContent=t;clearTimeout(msgT);msgT=setTimeout(()=>$('status').textContent='',ms)}
function hud(){
 $('score').textContent=Math.floor(score);$('speed').textContent=Math.floor(v*5.6);
 $('distance').textContent=Math.floor(distance);$('level').textContent=level;
 $('fuel').style.width=fuel+'%';
}
function clearEnts(){for(const e of ents)scene.remove(e.g);ents.length=0}
function startGame(){
 initAudio();clearEnts();
 score=distance=v=0;level=1;x=0;steer=0;fuel=100;spawnT=0;shield=false;combo=0;coins=0;
 dying=false;ts=1;running=true;paused=false;nitro=false;
 car.position.x=0;car.rotation.z=0;shieldM.visible=false;
 $('message').textContent='';$('brand').style.opacity=0;
 $('startScreen').style.display='none';$('pause').textContent='⏸';
 beep(660,.12,'sine',.08);hud();
}
function crash(){
 if(dying)return;
 dying=true;dieT=0;shake=1;nitro=false;
 beep(90,.5,'sawtooth',.14);
 try{navigator.vibrate&&navigator.vibrate([80,40,120])}catch{}
 $('message').textContent='CRASH!';
}
function endGame(){
 running=false;dying=false;ts=1;
 const s=Math.floor(score);try{parent.postMessage({type:"score",game:"racing",score:s},"*")}catch{}
 if(s>best){best=s;try{localStorage.setItem('rr2-best',String(best))}catch{}}
 $('best').textContent='BEST SCORE: '+best;
 $('last').textContent='SCORE '+s+' • COINS '+coins+' • '+Math.floor(distance)+' M';
 $('message').textContent='';$('brand').style.opacity=1;
 $('title').textContent='RACE OVER';$('start').textContent='↻ RACE AGAIN';
 $('startScreen').style.display='flex';
}
function bump(n,label){combo+=n;comboT=3;score+=(label?25:10)*mult();if(label)pop(label+' x'+mult())}
function setPause(p){
 if(!running||dying)return;paused=p;$('pause').textContent=p?'▶':'⏸';
 if(p){steer=0;nitro=false}
}

/* ---------- Input ---------- */
$('start').addEventListener('click',startGame);
$('pause').addEventListener('click',()=>setPause(!paused));
$('snd').addEventListener('click',()=>{sfxOn=!sfxOn;$('snd').textContent=sfxOn?'🔊':'🔇'});
function hold(id,dn,up){
 const b=$(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch{}dn()});
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,up);
}
hold('left',()=>steer=-1,()=>{if(steer===-1)steer=0});
hold('right',()=>steer=1,()=>{if(steer===1)steer=0});
hold('nitro',()=>nitro=true,()=>nitro=false);
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='a')steer=-1;
 if(k==='arrowright'||k==='d')steer=1;
 if(e.code==='Space'){nitro=true;e.preventDefault()}
 if(k==='p')setPause(!paused);
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(['arrowleft','arrowright','a','d'].includes(k))steer=0;
 if(e.code==='Space')nitro=false;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){steer=0;nitro=false;setPause(true)}});

/* ---------- Main loop ---------- */
function animate(time){
 requestAnimationFrame(animate);
 const raw=Math.min((time-last)/1000||0,.035);last=time;
 let boost=false,dt=0;
 if(running&&!paused){
  if(dying){dieT+=raw;ts=lp(ts,.2,Math.min(1,raw*6));if(dieT>1)endGame()}
  dt=raw*ts;
  level=1+Math.floor(distance/700);
  vBase=Math.min(26+(level-1)*2.6,52);
  boost=!dying&&nitro&&fuel>0;
  v=lp(v,dying?0:vBase*(boost?1.55:1),Math.min(1,raw*(dying?1.5:3)));
  fuel=boost?Math.max(0,fuel-28*dt):Math.min(100,fuel+8*dt);
  x=cl(x+(dying?0:steer)*6*dt,-3.2,3.2);
  car.position.x=lp(car.position.x,x,Math.min(1,dt*12));
  car.rotation.z=lp(car.rotation.z,-steer*.1,Math.min(1,dt*8));
  const m=v*dt;
  distance+=m;score+=m*(boost?2:1);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  spawnT+=dt;
  if(spawnT>Math.max(.55,1.3-level*.1)&&!dying){spawn();spawnT=0}

  for(const d of dashes){d.position.z+=m;if(d.position.z>8)d.position.z-=110}
  for(const b of buildings){b.position.z+=m*.5;if(b.position.z>15)b.position.z=-125-R()*20}
  for(const a of arches){a.position.z+=m;if(a.position.z>12)a.position.z-=144}
  for(let i=0;i<PN;i++){let z=pp[i*3+2]+m*1.3;if(z>10){z=-130;pp[i*3]=(R()-.5)*30}pp[i*3+2]=z}
  pg.attributes.position.needsUpdate=true;
  pm.opacity=boost?.9:.45;pm.size=boost?.25:.14;

  for(let i=ents.length-1;i>=0;i--){
   const e=ents[i],p=e.g.position;
   p.z+=v*e.s*dt;
   if(e.k==='veh'&&e.sw&&!e.done&&p.z>-60){
    e.done=true;const nl=e.lane===1?(R()<.5?0:2):1;e.tx=LANES[nl];
   }
   if(e.tx!==undefined)p.x=lp(p.x,e.tx,Math.min(1,dt*1.6));
   if(e.k==='coin'||e.k==='sh'||e.k==='nit')e.g.rotation.y+=4*dt;
   const dz=Math.abs(p.z-car.position.z),dx=Math.abs(p.x-car.position.x);
   let gone=false;
   if(!dying&&dz<e.l/2+1.3&&dx<e.w/2+.7){
    if(e.k==='coin'){coins++;bump(1);beep(880+Math.min(combo,10)*40,.07,'sine',.07);gone=true}
    else if(e.k==='sh'){shield=true;pop('SHIELD READY');beep(520,.2,'triangle',.08);gone=true}
    else if(e.k==='nit'){fuel=100;pop('NITRO REFILL');beep(740,.2,'triangle',.08);gone=true}
    else if(shield){shield=false;shake=.7;combo=0;pop('SHIELD BROKEN');beep(160,.25,'sawtooth',.1);gone=true}
    else{crash();break}
   }else if(!dying&&(e.k==='veh')&&!e.near&&dz<1.9&&dx<e.w/2+1.7){
    e.near=true;bump(1,'NEAR MISS');beep(1100,.06,'square',.05);
   }
   if(p.z>10||gone){
    if(p.z>10&&(e.k==='veh'||e.k==='bar')&&!dying)score+=15;
    scene.remove(e.g);ents.splice(i,1);
   }
  }
  for(const w of wheels)w.rotation.x+=m*.8;
  shieldM.visible=shield;if(shield)shieldM.rotation.y+=dt*2;
  for(const j of jets){j.visible=boost;j.scale.y=.8+R()*.6}
  $('nitro').firstChild.textContent=boost?'⚡ BOOST':'⚡ NITRO';
  hud();
 }else if(!running){for(const j of jets)j.visible=false;shieldM.visible=false}

 if(ac&&engG){
  const t=ac.currentTime;
  eng.frequency.setTargetAtTime(48+v*2.6,t,.08);
  engG.gain.setTargetAtTime(running&&!paused&&sfxOn?.045:0,t,.1);
 }

 /* camera: FOV kick on nitro, shake on impact, gentle idle sway on menu */
 const tf=63+(v/60)*5+(boost?10:0);
 fov=lp(fov,tf,Math.min(1,raw*4));cam.fov=fov;cam.updateProjectionMatrix();
 shake=Math.max(0,shake-raw*2);
 const sx=(R()-.5)*shake*.5,sy=(R()-.5)*shake*.5;
 const idle=running?0:Math.sin(time/1500)*1.2;
 cam.position.x=lp(cam.position.x,car.position.x*.32+idle,Math.min(1,raw*3))+sx;
 cam.position.y=4.1+sy+(running?0:Math.sin(time/2000)*.3);
 cam.position.z=boost?8.6:9.2;
 cam.lookAt(car.position.x*.45,.5,-5.5);
 rend.render(scene,cam);
}
requestAnimationFrame(animate);

addEventListener('resize',()=>{
 cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 rend.setPixelRatio(Math.min(devicePixelRatio||1,1.25));rend.setSize(innerWidth,innerHeight);
});
</script>
